# Escenario local de 1 y 2 millones de int32_t, dos reservas grandes DSM.
# El hogar 0 aporta 1 MiB, el 1 aporta 16 MiB; el nodo 2 tambien calcula.
# A cruza hogares 0/1; B se aloja en 1 al agotarse el aporte 0 (first-fit).
# Capacidad total suficiente para 2 * 2000000 * 4 bytes y el control.
# Para el TEC, generar copias con las IPv4 reales comunes a los tres nodos.
