memoria_inicial = 4096
max_nodos = 3
max_hilos = 16
heartbeat_intervalo_ms = 1000
heartbeat_fallos = 8
rpc_timeout_ms = 60000
puerto_rango_inicio = 27200
puerto_rango_fin = 27299
