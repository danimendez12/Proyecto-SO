# Demostracion con cuatro paginas. Cada hogar aporta como maximo dos.
# Para el laboratorio, reemplace la IPv4 de cada nodo en todas las copias.
page_size = 4096
memoria_inicial = 8192
max_nodos = 3
max_hilos = 8
heartbeat_intervalo_ms = 500
heartbeat_fallos = 3
rpc_timeout_ms = 3000
puerto_rango_inicio = 27200
puerto_rango_fin = 27299
nodo = 0 creador 127.0.0.1 27200 8192
nodo = 1 aportante 127.0.0.1 27201 8192
nodo = 2 lector 127.0.0.1 27202 4096
