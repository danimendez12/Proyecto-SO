; Plantilla de ejemplo. Todos los valores están pendientes de configurar.

; [dsm]
; page_size_bytes = <tamaño de página en bytes>
; initial_memory_per_node_bytes = <memoria inicial por nodo en bytes>
; max_nodes = <número máximo de nodos>
; max_threads = <número máximo de hilos>
; heartbeat_interval_ms = <intervalo de heartbeat en milisegundos>
; communication_timeout_ms = <timeout de comunicación en milisegundos>

