# Dos nodos locales en el rango asignado al proyecto.
# nodo = id nombre IPv4 puerto [memoria_bytes]
# Si se omite memoria_bytes, se usa memoria_inicial.
page_size = 4096
memoria_inicial = 1048576
max_nodos = 8
max_hilos = 32
heartbeat_intervalo_ms = 1000
heartbeat_fallos = 3
rpc_timeout_ms = 2000
puerto_rango_inicio = 27200
puerto_rango_fin = 27299
nodo = 0 nodo-a 127.0.0.1 27200
nodo = 1 nodo-b 127.0.0.1 27201
