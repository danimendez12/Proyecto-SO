# Plantilla para ocho procesos en cinco computadoras.
# Reemplazar <IPv4_A> a <IPv4_E> por las direcciones reales y descomentar los nodos.
# Usar el mismo archivo en todas las computadoras y elegir el ID al arrancar.
page_size = 4096
memoria_inicial = 1048576
max_nodos = 8
max_hilos = 32
heartbeat_intervalo_ms = 1000
heartbeat_fallos = 3
rpc_timeout_ms = 2000
puerto_rango_inicio = 27200
puerto_rango_fin = 27299
# nodo = id nombre IPv4 puerto [memoria_bytes]
# nodo = 0 nodo-a0 <IPv4_A> 27200 1048576
# nodo = 1 nodo-a1 <IPv4_A> 27201 1048576
# nodo = 2 nodo-a2 <IPv4_A> 27202 1048576
# nodo = 3 nodo-b0 <IPv4_B> 27203 1048576
# nodo = 4 nodo-b1 <IPv4_B> 27204 1048576
# nodo = 5 nodo-c0 <IPv4_C> 27205 1048576
# nodo = 6 nodo-d0 <IPv4_D> 27206 1048576
# nodo = 7 nodo-e0 <IPv4_E> 27207 1048576
